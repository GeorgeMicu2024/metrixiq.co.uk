name: eMentor Regression

on:
  push:
    branches:
      - "fix/mentor-daily-account-identity-*"
  pull_request:
    paths:
      - "lib/analyzer.js"
      - "lib/analyzer/spreadsheet.js"
      - "lib/persistence/mentorDaily.js"
      - "lib/persistence/mentorDailyIdentity.js"
      - "lib/persistence/identity.js"
      - "components/operations/MentorView.jsx"
      - "tests/mentor-shift-session-regression.test.mjs"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci_service_role_placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused eMentor source-account regression
        run: node --test tests/mentor-shift-session-regression.test.mjs
      - name: Production build
        run: npm run build
      - name: Existing test suite (separately reported; not a release gate)
        run: npm test
        continue-on-error: true
