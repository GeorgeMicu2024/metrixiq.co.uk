name: Production SEO Release Gate

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production base URL"
        required: true
        default: "https://www.metrixiq.co.uk"
      submit_indexnow:
        description: "Submit canonical sitemap URLs to IndexNow after all checks pass"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SEO_AUDIT_BASE_URL: ${{ inputs.base_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production SEO surface
        shell: bash
        run: |
          set -euo pipefail
          base="${SEO_AUDIT_BASE_URL%/}"

          test "$(curl -sS -o /tmp/pricing.html -w '%{http_code}' "$base/pricing")" = "200"
          grep -q "Choose the MetrixIQ plan" /tmp/pricing.html

          test "$(curl -sS -o /tmp/llms.txt -w '%{http_code}' "$base/llms.txt")" = "200"
          grep -q "MetrixIQ is fleet and driver performance software" /tmp/llms.txt

          test "$(curl -sS -o /tmp/security.txt -w '%{http_code}' "$base/.well-known/security.txt")" = "200"
          grep -q "Canonical: https://www.metrixiq.co.uk/.well-known/security.txt" /tmp/security.txt

          test "$(curl -sS -o /tmp/indexnow-key.txt -w '%{http_code}' "$base/ef82465f539835b58ac06a883439c0c0.txt")" = "200"
          test "$(tr -d '\r\n' < /tmp/indexnow-key.txt)" = "ef82465f539835b58ac06a883439c0c0"

      - name: Run full live SEO audit
        run: node scripts/seo-live-audit.mjs

      - name: Verify IndexNow production readiness
        run: node scripts/indexnow-submit.mjs

      - name: Submit canonical URLs to IndexNow
        if: ${{ inputs.submit_indexnow }}
        run: node scripts/indexnow-submit.mjs --submit
