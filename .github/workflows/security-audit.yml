name: Dependency Security Upgrade

on:
  push:
    branches:
      - feature/driver-scorecard-auth
    paths:
      - .github/workflows/security-audit.yml

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate Next.js security upgrade lockfile
        run: npm install --save --package-lock-only next@16.3.5
      - name: Audit upgraded dependency graph
        run: npm audit --omit=dev --json || true
      - name: Emit package files
        run: |
          echo "PACKAGE_JSON_BEGIN"
          base64 -w0 package.json
          echo
          echo "PACKAGE_JSON_END"
          echo "PACKAGE_LOCK_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "PACKAGE_LOCK_END"
