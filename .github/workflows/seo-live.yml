name: Live SEO Audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to audit"
        required: false
        default: "https://www.metrixiq.co.uk"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  live-seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SEO_AUDIT_BASE_URL: ${{ github.event.inputs.base_url || 'https://www.metrixiq.co.uk' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run live SEO audit
        run: node scripts/seo-live-audit.mjs
