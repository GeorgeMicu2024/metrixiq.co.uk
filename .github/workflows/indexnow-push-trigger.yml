name: IndexNow Push Trigger

on:
  push:
    branches:
      - feature/driver-scorecard-auth

permissions:
  contents: read

jobs:
  submit:
    if: ${{ contains(github.event.head_commit.message, '[indexnow-submit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify live key and submit canonical sitemap URLs
        run: node scripts/indexnow-submit.mjs --submit
