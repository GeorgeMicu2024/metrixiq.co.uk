          const s=fs.readFileSync(process.env.RUNNER_TEMP+'/metrixiq-regression.log','utf8');
          const actual=[...s.matchAll(/^not ok \d+ - ([^\r\n]+)/gm)].map(m=>m[1]).sort();
          const expected=["IADC workspace uses a focused database loader and preserves daily/weekly evidence","homepage sign-in authenticates directly instead of forwarding to a second login","public root no longer ships the full private application stylesheet","homepage sign-in hydration is deferred until the card nears the viewport","homepage visual redesign replaces long text walls with operational visuals","Root-Cause Engine explains the exact point-band loss","exact driver scorecard point bands match the Google Sheet","public landing page consumes the same canonical plan catalogue","team invite signup flow joins an existing workspace instead of asking for a new organisation","Concessions no longer reads its page data from the mixed operational matrix","homepage and About page define MetrixIQ as fleet and driver performance software","public navigation points to the dedicated pricing page","homepage and public navigation link to the resources hub","primary homepage CTAs are conversion tracked after analytics consent","solution pages are connected by internal links","homepage, public navigation and solution pages link into use cases","tests/wave-plan-ddn1.test.mjs"].sort();
          const match=(key)=>{const m=s.match(new RegExp('^# '+key+' (\\d+)','m'));assert.ok(m,'missing '+key+' summary');return Number(m[1]);};
          assert.equal(match('tests'),343,'test count changed');
          assert.equal(match('fail'),17,'regression failure count changed');
          assert.equal(match('pass'),326,'passed-test count changed');
          assert.deepEqual(actual,expected,'new or different regression failures after dependency patch');
          console.log('PASS: Exact baseline parity; 326 passing, 17 known failing, 0 new failures.');
          NODE
